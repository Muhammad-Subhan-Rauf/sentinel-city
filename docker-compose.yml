name: sentinel-city

services:
  # ── Postgres ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_city
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_city"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI backend (also runs the AI orchestrator loops via lifespan) ──
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel_city
      SENTINEL_API_URL: http://localhost:8000
      # Vertex AI Application Default Credentials. The .env file supplies
      # GOOGLE_CLOUD_PROJECT and GOOGLE_CLOUD_LOCATION; the service-account
      # JSON is mounted read-only via the volume below.
      GOOGLE_APPLICATION_CREDENTIALS: /app/vertex-sa.json
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - orchestrator_logs:/app/logs
      - ./backend/vertex-sa.json:/app/vertex-sa.json:ro

  # ── Nginx-served React SPA ──────────────────────────────────
  # Routing is delegated to Stadia Maps' hosted Valhalla service. The API
  # key is passed as a build arg (read from the host env or a .env file
  # at the project root) so it doesn't get committed to source control.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ""
        VITE_VALHALLA_URL: "https://api.stadiamaps.com"
        VITE_STADIA_API_KEY: "${VITE_STADIA_API_KEY:-}"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  orchestrator_logs:
